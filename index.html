
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="C Programming File Library"
    >

    <title>C Programming Library</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside class="sidebar">

        <div class="logo">

            <div class="logo-icon">
                C
            </div>

            <div>
                <h2>C Library</h2>
                <span>Programming Files</span>
            </div>

        </div>


        <nav class="sidebar-nav">

            <button
                class="nav-item active"
                id="homeButton"
            >

                <span class="nav-icon">⌂</span>

                <span>
                    Home
                </span>

            </button>


            <div class="nav-title">
                LIBRARY
            </div>


            <button class="nav-item">

                <span class="nav-icon">C</span>

                <span>
                    C Programming
                </span>

            </button>


            <button class="nav-item">

                <span class="nav-icon">⌘</span>

                <span>
                    Data Structures
                </span>

            </button>


            <button class="nav-item">

                <span class="nav-icon">⚙</span>

                <span>
                    Projects
                </span>

            </button>

        </nav>


        <div class="sidebar-bottom">

            <div class="sidebar-info">

                <span class="status-dot"></span>

                <div>

                    <strong>Library Online</strong>

                    <small>
                        Files available
                    </small>

                </div>

            </div>

        </div>

    </aside>


    <!-- =========================
         MAIN
    ========================== -->

    <div class="app">


        <!-- =========================
             TOP BAR
        ========================== -->

        <header class="topbar">

            <div class="mobile-logo">

                <div class="logo-icon">
                    C
                </div>

                <strong>
                    C Library
                </strong>

            </div>


            <div class="search-wrapper">

                <span class="search-icon">
                    🔍
                </span>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search files and folders..."
                    autocomplete="off"
                >

            </div>


            <div class="top-actions">

                <button
                    class="icon-button"
                    id="refreshButton"
                    title="Refresh"
                >
                    ↻
                </button>

            </div>

        </header>


        <!-- =========================
             CONTENT
        ========================== -->

        <main class="content">


            <!-- Breadcrumb -->

            <div class="breadcrumb-section">

                <div
                    id="breadcrumb"
                    class="breadcrumb"
                >

                    <button
                        class="breadcrumb-home"
                        id="breadcrumbHome"
                    >
                        Home
                    </button>

                    <span>
                        /
                    </span>

                    <span id="currentPath">
                        /
                    </span>

                </div>

            </div>


            <!-- Page Header -->

            <section class="page-header">

                <div>

                    <div class="title-row">

                        <div class="folder-large-icon">
                            📁
                        </div>

                        <div>

                            <h1 id="folderTitle">
                                C Programming
                            </h1>

                            <p id="folderDescription">
                                Browse your C programming files and folders
                            </p>

                        </div>

                    </div>

                </div>


                <div class="header-actions">

                    <button
                        id="backButton"
                        class="secondary-button"
                    >
                        ← Back
                    </button>

                </div>

            </section>


            <!-- Stats -->

            <section class="stats">

                <div class="stat-card">

                    <span class="stat-icon">
                        📁
                    </span>

                    <div>

                        <strong id="folderCount">
                            0
                        </strong>

                        <span>
                            Folders
                        </span>

                    </div>

                </div>


                <div class="stat-card">

                    <span class="stat-icon">
                        📄
                    </span>

                    <div>

                        <strong id="fileCount">
                            0
                        </strong>

                        <span>
                            Files
                        </span>

                    </div>

                </div>

            </section>


            <!-- Files -->

            <section class="files-section">

                <div class="section-header">

                    <div>

                        <h2>
                            Files & Folders
                        </h2>

                        <p>
                            Browse the contents of this directory
                        </p>

                    </div>


                    <div
                        id="itemCount"
                        class="item-count"
                    >
                        0 items
                    </div>

                </div>


                <div
                    id="file-container"
                    class="file-container"
                >

                    <div class="loading">

                        <div class="loader"></div>

                        <p>
                            Loading files...
                        </p>

                    </div>

                </div>

            </section>


        </main>


        <!-- =========================
             CODE VIEWER
        ========================== -->

        <div
            id="codeViewer"
            class="code-viewer hidden"
        >

            <div class="code-header">

                <div class="code-file-info">

                    <span class="code-file-icon">
                        C
                    </span>

                    <div>

                        <strong id="codeFileName">
                            file.c
                        </strong>

                        <small>
                            C Source File
                        </small>

                    </div>

                </div>


                <div class="code-actions">

                    <button
                        id="copyCode"
                        class="code-button"
                    >
                        Copy
                    </button>

                    <button
                        id="downloadCode"
                        class="code-button"
                    >
                        Download
                    </button>

                    <button
                        id="openCodeNewTab"
                        class="code-button"
                    >
                        Open
                    </button>

                    <button
                        id="closeCode"
                        class="close-button"
                    >
                        ×
                    </button>

                </div>

            </div>


            <div class="code-body">

                <pre><code id="codeContent"></code></pre>

            </div>

        </div>


        <!-- =========================
             MOBILE BOTTOM
        ========================== -->

        <nav class="mobile-nav">

            <button
                id="mobileHome"
                class="mobile-nav-item active"
            >

                <span>
                    ⌂
                </span>

                <small>
                    Home
                </small>

            </button>


            <button
                id="mobileBack"
                class="mobile-nav-item"
            >

                <span>
                    ←
                </span>

                <small>
                    Back
                </small>

            </button>


            <button
                id="mobileRefresh"
                class="mobile-nav-item"
            >

                <span>
                    ↻
                </span>

                <small>
                    Refresh
                </small>

            </button>

        </nav>


    </div>


    <script
        src="script.js"
    ></script>

</body>

</html>
