<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#1d4ed8"
    >

    <title>My C Files</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =================================================
         HEADER
    ================================================== -->

    <header class="site-header">

        <div class="header-content">

            <div class="brand">

                <div class="brand-icon">
                    💻
                </div>

                <div>

                    <h1>
                        My C Files
                    </h1>

                    <p>
                        C Programming & Embedded Systems Resources
                    </p>

                </div>

            </div>

        </div>

    </header>



    <!-- =================================================
         MAIN
    ================================================== -->

    <main class="main-container">


        <!-- TOOLBAR -->

        <div class="toolbar">


            <button
                id="backButton"
                class="toolbar-button"
                title="Go back"
            >
                ←
                <span>Back</span>
            </button>


            <button
                id="homeButton"
                class="toolbar-button home-button"
                title="Go home"
            >
                🏠
                <span>Home</span>
            </button>


            <div
                id="currentPath"
                class="breadcrumb"
            >
                /
            </div>


            <div class="search-wrapper">

                <span class="search-icon">
                    🔍
                </span>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search files..."
                    autocomplete="off"
                >

            </div>

        </div>



        <!-- PAGE HEADING -->

        <div class="page-heading">

            <div>

                <h2 id="folderTitle">
                    📁 Home
                </h2>

                <p id="folderDescription">
                    Browse your files and folders
                </p>

            </div>

        </div>



        <!-- FILES -->

        <div
            id="file-container"
            class="file-container"
        >

            <div class="loading">

                <div class="loading-spinner"></div>

                <p>
                    Loading files...
                </p>

            </div>

        </div>


    </main>



    <!-- =================================================
         CODE VIEWER
    ================================================== -->

    <div
        id="codeViewer"
        class="viewer-overlay hidden"
    >

        <div class="viewer-window">


            <div class="viewer-header">


                <div class="viewer-title">

                    <span id="codeIcon">
                        💻
                    </span>

                    <span id="codeFileName">
                        Code
                    </span>

                </div>


                <div class="viewer-actions">

                    <button
                        id="downloadCode"
                        title="Download"
                    >
                        ⬇️
                    </button>

                    <button
                        id="openCodeNewTab"
                        title="Open in new tab"
                    >
                        ↗️
                    </button>

                    <button
                        id="closeCode"
                        title="Close"
                    >
                        ✕
                    </button>

                </div>

            </div>


            <div class="code-body">

                <pre><code id="codeContent"></code></pre>

            </div>


        </div>

    </div>



    <!-- =================================================
         SCRIPT
    ================================================== -->

    <script
        src="script.js"
    ></script>


</body>

</html>
