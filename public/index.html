<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="C Programming and Embedded Systems Resources"
>

<title>My C Files</title>

<link
    rel="stylesheet"
    href="style.css"
>


</head>

<body>

<!-- =====================================================
     HEADER
====================================================== -->

<header class="site-header">

    <div class="header-content">

        <div class="brand">

            <div class="brand-icon">
                💻
            </div>

            <div>

                <h1>
                    My C Files
                </h1>

                <p>
                    C Programming & Embedded Systems Resources
                </p>

            </div>

        </div>

    </div>

</header>


<!-- =====================================================
     MAIN
====================================================== -->

<main class="main-container">


    <!-- =================================================
         TOOLBAR
    ================================================== -->

    <div class="toolbar">

        <button
            id="homeButton"
            class="toolbar-button home-button"
            type="button"
        >
            🏠
            <span>Home</span>
        </button>


        <button
            id="backButton"
            class="toolbar-button"
            type="button"
        >
            ←
            <span>Back</span>
        </button>


        <div
            id="currentPath"
            class="breadcrumb"
        >
            /
        </div>


        <div class="search-wrapper">

            <span class="search-icon">
                🔍
            </span>

            <input
                id="searchInput"
                type="search"
                placeholder="Search files..."
                autocomplete="off"
            >

        </div>

    </div>


    <!-- =================================================
         FOLDER HEADER
    ================================================== -->

    <div class="page-heading">

        <div>

            <h2 id="folderTitle">
                📁 Home
            </h2>

            <p id="folderDescription">
                Browse your files and folders
            </p>

        </div>

    </div>


    <!-- =================================================
         FILE CONTAINER
    ================================================== -->

    <div
        id="file-container"
        class="file-container"
    >

        <div class="loading">

            <div class="loading-spinner"></div>

            <p>
                Loading...
            </p>

        </div>

    </div>


</main>


<!-- =====================================================
     CODE VIEWER
====================================================== -->

<div
    id="codeViewer"
    class="viewer-overlay hidden"
>

<div class="viewer-window">

    <div class="viewer-header">

        <div class="viewer-title">

            <span>💻</span>

            <span id="codeFileName">
                Code
            </span>

        </div>


        <div class="viewer-actions">

            <button
                id="downloadCode"
                type="button"
                title="Download"
            >
                ⬇️
            </button>


            <button
                id="openCodeNewTab"
                type="button"
                title="Open in new tab"
            >
                ↗
            </button>


            <button
                id="closeCode"
                type="button"
                title="Close"
            >
                ✕
            </button>

        </div>

    </div>


    <div class="code-body">

        <pre><code id="codeContent"></code></pre>

    </div>

</div>


</div>



        <!-- =============================================
             CODE BODY
        ============================================== -->

        <div class="code-body">

            <pre><code id="codeContent"></code></pre>

        </div>

    </div>

</div>


<!-- =====================================================
     FOOTER
====================================================== -->

<footer class="site-footer">

    <p>
        My C Programming Files
    </p>

    <span>
        C Programming • Embedded Systems • STM32
    </span>

</footer>


<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script
    src="script.js"
></script>

</body>

</html>
